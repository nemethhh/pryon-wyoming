name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the add-on and package version
        run: |
          addon=$(sed -n 's/^version: *//p' pypryon/config.yaml)
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pypryon/__init__.py)
          test "v$addon" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, config.yaml $addon"; exit 1; }
          test "$addon" = "$package" || { echo "config.yaml $addon, __version__ $package"; exit 1; }

  addon:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: base
        run: |
          echo "image=$(sed -n 's/^ *${{ matrix.arch }}: *//p' pypryon/build.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pypryon/Dockerfile
          build-args: BUILD_FROM=${{ steps.base.outputs.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pypryon:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pypryon:latest
