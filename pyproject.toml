[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypryon"
version = "0.0.1"
description = "Run Amazon Pryon wake-word models on stock onnxruntime"
license = "MIT"
readme = "README.md"
dependencies = [
    "numpy",
    "onnx",
    "onnxruntime",
]

[tool.setuptools]
packages = ["pypryon"]
