[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypryon"
dynamic = ["version"]
description = "Amazon Pryon wake-word models on stock onnxruntime, with a Wyoming server for Home Assistant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Oleksandr Martynenko" }]
keywords = ["wake word", "keyword spotting", "home assistant", "wyoming", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "wyoming>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/nemethhh/pryon-wyoming"
Issues = "https://github.com/nemethhh/pryon-wyoming/issues"

[project.optional-dependencies]
zeroconf = ["zeroconf>=0.132"]

[project.scripts]
pypryon = "pypryon.cli:main"
pypryon-wyoming = "pypryon.wyoming.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/pypryon/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs", "/pypryon", "/build"]

[tool.hatch.build.targets.wheel]
packages = ["src/pypryon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# wyoming itself imports audioop on Python < 3.13
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_oracle.py" = ["E501"]  # verbatim captured oracle output

[tool.ruff.lint.isort]
known-first-party = ["pypryon"]
known-local-folder = ["conftest", "synthmodel", "test_graph_surgery", "test_wyoming", "pryon_oracle"]
