[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypryon"
version = "0.1.0"
description = "Run Amazon Pryon wake-word models on stock onnxruntime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "wyoming>=1.5,<2",
]

[project.optional-dependencies]
zeroconf = ["zeroconf>=0.132"]

[project.scripts]
pypryon = "pypryon.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pypryon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
